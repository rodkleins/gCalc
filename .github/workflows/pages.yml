name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build da calculadora publicada
        run: npm run build

      - name: Conferir a calculadora, o rascunho e a página de cálculos
        run: |
          test -f dist/index.html
          test -f dist/headtohead/index.html
          test -f dist/calculos/index.html
          if grep -q '/gCalc/preview/' dist/index.html; then
            echo "A raiz não pode apontar para /preview/."
            exit 1
          fi

      - name: Build de teste em /preview/
        run: |
          if ! git ls-remote --exit-code --heads origin fix/financial-model-audit >/dev/null; then
            echo "Branch fix/financial-model-audit ausente. Publicando só a main."
            exit 0
          fi
          git fetch --depth 1 origin fix/financial-model-audit
          git worktree add --detach preview-src FETCH_HEAD
          npm ci --prefix preview-src
          npm test --prefix preview-src
          VITE_PREVIEW=1 VITE_BASE=/gCalc/preview/ npm run build --prefix preview-src
          mkdir -p dist/preview
          cp -a preview-src/dist/. dist/preview/
          test -f dist/index.html
          test -f dist/preview/index.html
          test -f dist/preview/headtohead/index.html
          test -f dist/preview/calculos/index.html
          grep -q '/gCalc/preview/' dist/preview/index.html
          if grep -q '/gCalc/preview/' dist/index.html; then
            echo "A raiz foi contaminada pelo build de teste."
            exit 1
          fi

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
