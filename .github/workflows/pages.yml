# Publica a calculadora, /headtohead/, /calculos/ e a versão em validação /rh/ em /gCalc/, sem /preview/.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Conferir a calculadora, o rascunho e a página de cálculos
        run: |
          test -f dist/index.html
          test -f dist/headtohead/index.html
          test -f dist/calculos/index.html
          test -f dist/rh/index.html
          test -f dist/rh/calculos/index.html
          if grep -q '/gCalc/preview/' dist/index.html; then
            echo "A raiz não pode apontar para /preview/."
            exit 1
          fi
          if [ -d dist/preview ]; then
            echo "O artefato não deve incluir /preview/."
            exit 1
          fi

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
